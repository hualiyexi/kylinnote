name: Build and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux-arm64:
    name: Linux ARM64 / Qt 5.12 / glibc 2.31
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      # Current stable actions, verified to use Node 24.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Native ARM64 build and CTest in Ubuntu 20.04
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/src -w /src ubuntu:20.04 \
            bash packaging/ci-build.sh

      - name: Install regular package with system Qt in a separate container
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/src -w /src ubuntu:20.04 bash -eu -o pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            if ! apt-get update -o APT::Update::Error-Mode=any; then
              sed -i -E "s|https?://(archive.ubuntu.com/ubuntu|security.ubuntu.com/ubuntu|ports.ubuntu.com/ubuntu-ports)|http://old-releases.ubuntu.com/ubuntu|g" /etc/apt/sources.list
              apt-get update -o APT::Update::Error-Mode=any
            fi
            packages=(dist/kylinlist_*_arm64.deb)
            test "${#packages[@]}" -eq 1
            apt-get install -y --no-install-recommends "./${packages[0]}"
            test -x /usr/bin/kylinlist
            test "$(dpkg-query -W -f="\${Status}" kylinlist)" = "install ok installed"
          '

      - name: Prepare clean runtime image with base graphics dependencies only
        run: |
          bundles=(dist/kylinlist_*_arm64_bundle.deb)
          test "${#bundles[@]}" -eq 1
          docker run --name kylinlist-runtime-base --platform linux/arm64 \
            -v "$PWD":/src:ro -w /src ubuntu:20.04 \
            bash packaging/test-bundle.sh --prepare "${bundles[0]}"
          docker commit kylinlist-runtime-base kylinlist-runtime:test
          docker rm kylinlist-runtime-base

      - name: Offline dpkg install, every ELF dependency and real X11 app smoke
        run: |
          bundles=(dist/kylinlist_*_arm64_bundle.deb)
          docker run --rm --platform linux/arm64 --network none \
            -v "$PWD":/src:ro -w /src kylinlist-runtime:test \
            bash packaging/test-bundle.sh "${bundles[0]}"

      - name: Upload ARM64 packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kylinlist-linux-arm64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 / Qt 5.12.8 / MinGW 7.3
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned local build tools and Qt
        run: |
          python -m venv .tools/venv
          New-Item -ItemType Directory -Force .tools/tmp,.tools/appdata | Out-Null
          $env:TEMP = "$PWD/.tools/tmp"
          $env:TMP = $env:TEMP
          $env:APPDATA = "$PWD/.tools/appdata"
          & ./.tools/venv/Scripts/python.exe -m pip install --disable-pip-version-check aqtinstall==3.3.0 cmake==3.31.10 ninja==1.13.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./.tools/venv/Scripts/python.exe -m aqt install-qt windows desktop 5.12.8 win64_mingw73 -O .tools/Qt --archives qtbase qtsvg qttools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./.tools/venv/Scripts/python.exe -m aqt install-tool windows desktop tools_mingw qt.tools.win64_mingw730 -O .tools/Qt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build, CTest, deploy, smoke, zip and current-user offline installer
        run: |
          $iscc = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'The runner image no longer contains Inno Setup 6' }
          ./packaging/build-windows.ps1 `
            -CMake "$PWD/.tools/venv/Scripts/cmake.exe" `
            -Ninja "$PWD/.tools/venv/Scripts/ninja.exe" `
            -QtRoot "$PWD/.tools/Qt/5.12.8/mingw73_64" `
            -CompilerRoot "$PWD/.tools/Qt/Tools/mingw730_64" `
            -InnoSetupCompiler $iscc

      - name: Install, start, uninstall and verify user data survives
        run: |
          $target = "$env:RUNNER_TEMP/kylinlist-install-test"
          $data = "$env:RUNNER_TEMP/kylinlist-data-test"
          ./packaging/test-windows.ps1 -Installer "$PWD/dist/KylinList-1.1.0-Windows-x64-Setup.exe" `
            -InstallDir $target -DataDir $data

      - name: Upload portable and installer packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kylinlist-windows-x64
          path: |
            dist/*.zip
            dist/*-Setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish existing version tag after both platforms pass
    needs: [linux-arm64, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: kylinlist-*
          merge-multiple: true
          path: dist
      - name: Release artifacts for this existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
