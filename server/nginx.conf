# KylinList 内网更新、统计与产品页 nginx 配置（conf.d 片段）。
# 生产宿主 nginx 会覆盖 X-Real-IP；直连开发服务器时回退为连接来源 IP。
map $http_x_real_ip $kylin_client_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}

log_format kylin_download escape=json
    '{"request_id":"$request_id","time":"$time_iso8601","ip":"$kylin_client_ip",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes_sent":$body_bytes_sent}';

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log combined;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 统计接口由同源 nginx 转发；宿主 nginx 已覆盖真实 IP，禁止信任客户端直填的请求体 IP。
    location /api/v1/stats/ {
        client_max_body_size 16k;
        proxy_pass http://stats:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $kylin_client_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # 版本清单与历史公告需要尽快更新，禁止缓存。
    location /updates/v1/ {
        autoindex off;
        add_header Cache-Control "no-cache" always;
    }

    # 安装包不可变；实际下载记录写入独立 JSON 日志，由 stats 容器增量导入。
    location /updates/files/ {
        autoindex off;
        access_log /var/log/nginx/downloads.json.log kylin_download;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 静态首屏、样式与脚本均同源，无外部资源；样式/脚本更新后无需清缓存。
    location / {
        autoindex off;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
