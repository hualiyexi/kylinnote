# KylinList 内网更新服务 nginx 配置（conf.d 片段，挂载为 /etc/nginx/conf.d/default.conf）。
# 职责：版本清单 no-cache、安装包按版本路径长缓存；不提供目录列表，其余路径一律 404。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # 存活检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 版本清单：客户端需要尽快看到新版本，禁止缓存
    location /updates/v1/ {
        autoindex off;
        add_header Cache-Control "no-cache" always;
    }

    # 安装包：路径含版本号且内容不可变（同版本禁止原地替换），可永久缓存
    location /updates/files/ {
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 其余路径不提供任何内容
    location / {
        autoindex off;
        return 404;
    }
}
